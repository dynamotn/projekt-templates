description: Helm chart in ~/Working/personal/infra, under dynamo-infra
source:
  template: helm-chart
register:
  workspace: ~/Working/personal/infra
  prefix: infra
  tags: [helm, kubernetes, infra]
  remote:
    host: gl
    group: dynamo-infra
    branch: main
after:
  - git init -q -b main
  - git add -A && git commit -q -m "Start {{ .Name }}"
