description: OpenTofu module in ~/Working/personal/infra, under dynamo-infra
source:
  template: terraform-module
register:
  workspace: ~/Working/personal/infra
  prefix: infra
  tags: [terraform, opentofu, infra]
  remote:
    host: gl
    group: dynamo-infra
    branch: main
after:
  - git init -q -b main
  - git add -A && git commit -q -m "Start {{ .Name }}"
