description: OPA policy in ~/Working/personal/infra, under dynamo-infra
source:
  template: rego-policy
register:
  workspace: ~/Working/personal/infra
  prefix: infra
  tags: [rego, opa, policy, infra]
  remote:
    host: gl
    group: dynamo-infra
    branch: main
after:
  - git init -q -b main
  - git add -A && git commit -q -m "Start {{ .Name }}"
