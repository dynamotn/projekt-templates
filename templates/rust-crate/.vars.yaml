vars:
  - name: summary
    prompt: What does it do, in one line
  - name: edition
    type: choice
    choices: ["2021", "2024"]
    default: "2024"
  - name: kind
    prompt: Binary or library crate
    type: choice
    choices: [bin, lib]
    default: bin
after:
  - '{{ if lookPath "cargo" }}cargo fmt{{ end }}'
  - '{{ if lookPath "git" }}git init -q{{ end }}'
