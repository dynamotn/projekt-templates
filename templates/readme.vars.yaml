vars:
  - name: project
    default: "{{ .Name }}"
  - name: summary
    prompt: What does it do, in one line
  - name: repo
    prompt: Repository URL
  - name: install
    prompt: Install command
  - name: usage
    prompt: Usage example
    default: "{{ .Name }}"
  - name: license
    type: choice
    choices: [MIT, Apache-2.0, BSD-2-Clause, GPL-3.0, Unlicense, WTFPL, CC-BY-NC-SA-4.0]
    default: MIT
